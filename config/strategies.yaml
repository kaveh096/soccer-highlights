# Named detection strategy presets for tuning rounds. Each entry is a
# partial config overlay applied on top of config/default.yaml. Keep names
# stable across tuning rounds so results stay comparable; adjust numbers.
#
# Round 1: crowd_* (RMS-energy, reacts to crowd/cheer swells) and strike_*
# (onset-flux, reacts to sharp transients like ball strikes) each split
# into a loose/strict sensitivity variant.
#
# Numbers below came from a threshold sweep against the test recording
# (see session notes), not a first guess: threshold_sigma turned out to
# have almost no effect in the 2.0-4.0 range for either algorithm (the
# rolling MAD is tiny relative to real peaks), so min_score/min_score_dbfs
# is doing essentially all the discriminating work. Targets were chosen so
# "loose" stays well short of covering the whole game (~30-40% of runtime)
# while "strict" stays clearly selective (~10-15%). Expect to retune again
# once human review flags true/false positives.
strategies:
  crowd_loose:
    detection:
      strategy: rms_energy
      rms_energy:
        threshold_sigma: 3.0
        min_score_dbfs: 4.0

  crowd_strict:
    detection:
      strategy: rms_energy
      rms_energy:
        threshold_sigma: 4.0
        min_score_dbfs: 5.0

  strike_loose:
    detection:
      strategy: onset_flux
      onset_flux:
        threshold_sigma: 2.0
        min_score: 0.65

  strike_strict:
    detection:
      strategy: onset_flux
      onset_flux:
        threshold_sigma: 2.0
        min_score: 0.85
