[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-highlights"
version = "0.1.0"
description = "Extracts shots-on-target highlights from long soccer recordings via audio peak detection."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "matplotlib",
    # Draws the scoreboard chrome PNG that ffmpeg composites onto exports
    # (soccer_highlights.scoreboard). Previously present only transitively via
    # matplotlib -- declared now that it is imported directly.
    "pillow",
    "anthropic",
    "python-dotenv",
    "tzdata",
]

[project.scripts]
soccer-highlights = "soccer_highlights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
